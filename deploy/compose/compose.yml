services:
  rag-service:
    build:
      context: ../..
      dockerfile: rag-service/Dockerfile
    ports:
      - "8000:8000"

  gateway:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    depends_on:
      - rag-service
    environment:
      GATEWAY_LISTEN_ADDR: ":8080"
      GATEWAY_RAG_SERVICE_BASE_URL: "http://rag-service:8000"
      GATEWAY_BOOTSTRAP_PLATFORM_API_KEY: "platform-live-key"
      GATEWAY_BOOTSTRAP_PROVIDER: "openai"
      GATEWAY_BOOTSTRAP_PROVIDER_DISPLAY_NAME: "OpenAI Primary"
      GATEWAY_BOOTSTRAP_PROVIDER_BASE_URL: "https://api.openai.com/v1"
      GATEWAY_BOOTSTRAP_PROVIDER_API_KEY: "dummy-provider-key"
      GATEWAY_BOOTSTRAP_SUPPORTED_MODELS: "gpt-4o-mini,text-embedding-3-small"
    ports:
      - "8080:8080"

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
    depends_on:
      - gateway
    ports:
      - "3000:8080"
